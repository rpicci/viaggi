<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<title>Viaggi</title>
<meta name="theme-color" content="#0E1A2B">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Viaggi">
<link rel="icon" type="image/png" sizes="32x32" href="icon-32.png">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="apple-touch-icon" sizes="192x192" href="icon-192.png">
<link rel="manifest" href="manifest.json">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;600;700;800&family=IBM+Plex+Mono:wght@400;500;600&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
:root{
  --ink:#0E1A2B;
  --paper:#FBF6EC;
  --paper-2:#F2EBDA;
  --gold:#C89B3C;
  --gold-deep:#9C7526;
  --slate:#6B7A90;
  --slate-2:#9AA7B8;
  --text-dark:#1B2430;
  --text-mute:#5B6675;
  --line:#DCD2B8;
  --danger:#B65C38;
  --ok:#3E6B4F;
  --radius:18px;
}
*{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
html,body{margin:0;padding:0;}
body{
  background:var(--ink);
  background-image:
    radial-gradient(circle at 15% 8%, rgba(200,155,60,0.10), transparent 40%),
    radial-gradient(circle at 90% 90%, rgba(200,155,60,0.06), transparent 45%);
  color:var(--paper);
  font-family:'Inter',system-ui,sans-serif;
  min-height:100vh;
  padding-bottom:48px;
}
::selection{background:var(--gold); color:var(--ink);}
button{font-family:inherit;}
input,textarea,select{font-family:inherit;}

/* Header */
header.top{
  padding:28px 20px 18px;
  position:relative;
  display:flex;
  justify-content:space-between;
  align-items:flex-start;
}
header.top .eyebrow{
  font-family:'IBM Plex Mono',monospace;
  font-size:11px;
  letter-spacing:.18em;
  text-transform:uppercase;
  color:var(--gold);
  margin:0 0 6px;
}
header.top h1{
  font-family:'Archivo',sans-serif;
  font-weight:800;
  font-size:34px;
  letter-spacing:-.01em;
  margin:0;
  color:var(--paper);
}
header.top .sub{
  margin:6px 0 0;
  font-size:13.5px;
  color:var(--slate-2);
}
.menu-btn{
  width:42px; height:42px;
  border-radius:50%;
  background:rgba(255,255,255,0.06);
  border:1px solid rgba(255,255,255,0.1);
  color:var(--paper);
  font-size:18px;
  display:flex; align-items:center; justify-content:center;
  cursor:pointer;
  flex-shrink:0;
  margin-top:4px;
}

.stats-row{
  display:flex;
  gap:10px;
  margin:18px 20px 4px;
}
.stat-chip{
  flex:1;
  background:rgba(255,255,255,0.04);
  border:1px solid rgba(255,255,255,0.08);
  border-radius:14px;
  padding:10px 12px;
}
.stat-chip .n{
  font-family:'IBM Plex Mono',monospace;
  font-weight:600;
  font-size:20px;
  color:var(--paper);
  line-height:1;
}
.stat-chip .l{
  font-size:10.5px;
  color:var(--slate-2);
  text-transform:uppercase;
  letter-spacing:.06em;
  margin-top:4px;
}

.filters{
  display:flex;
  gap:8px;
  margin:20px 20px 6px;
  overflow-x:auto;
  scrollbar-width:none;
}
.filters::-webkit-scrollbar{display:none;}
.filter-btn{
  font-family:'IBM Plex Mono',monospace;
  font-size:12px;
  letter-spacing:.03em;
  padding:8px 14px;
  border-radius:999px;
  border:1px solid rgba(255,255,255,0.14);
  background:transparent;
  color:var(--slate-2);
  white-space:nowrap;
  cursor:pointer;
}
.filter-btn.active{
  background:var(--gold);
  border-color:var(--gold);
  color:var(--ink);
  font-weight:600;
}

.dest-filter{
  position:relative;
  margin:14px 20px 4px;
  display:flex;
  align-items:center;
}
.dest-filter input{
  width:100%;
  padding:11px 38px 11px 14px;
  border-radius:12px;
  border:1px solid rgba(255,255,255,0.14);
  background:rgba(255,255,255,0.04);
  color:var(--paper);
  font-size:13.5px;
}
.dest-filter input::placeholder{color:var(--slate-2);}
.dest-filter input:focus{outline:none; border-color:var(--gold);}
.dest-filter #destClear{
  position:absolute;
  right:8px;
  width:26px; height:26px;
  border-radius:50%;
  border:none;
  background:rgba(255,255,255,0.1);
  color:var(--slate-2);
  font-size:12px;
  cursor:pointer;
  display:none;
  align-items:center; justify-content:center;
}
.dest-filter #destClear.show{display:flex;}

.sort-row{
  display:flex;
  align-items:center;
  gap:10px;
  margin:12px 20px 4px;
}
.sort-row label{
  font-family:'IBM Plex Mono',monospace;
  font-size:11px;
  text-transform:uppercase;
  letter-spacing:.05em;
  color:var(--slate-2);
  white-space:nowrap;
}
.sort-row select{
  flex:1;
  padding:9px 12px;
  border-radius:10px;
  border:1px solid rgba(255,255,255,0.14);
  background:rgba(255,255,255,0.04);
  color:var(--paper);
  font-size:13px;
  font-family:'Inter',sans-serif;
}
.sort-row select:focus{outline:none; border-color:var(--gold);}
.sort-row select option{ background:var(--ink); color:var(--paper); }

.list{
  padding:14px 16px 10px;
  display:flex;
  flex-direction:column;
  gap:16px;
}

.new-trip-btn{
  margin:4px 16px 0;
  padding:13px;
  border-radius:14px;
  border:1.5px dashed rgba(255,255,255,0.22);
  background:transparent;
  color:var(--slate-2);
  font-size:13px;
  font-weight:600;
  cursor:pointer;
  text-align:center;
}

.ticket{
  position:relative;
  background:var(--paper);
  border-radius:var(--radius);
  color:var(--text-dark);
  cursor:pointer;
  box-shadow:0 14px 30px -12px rgba(0,0,0,0.55);
  transition:transform .15s ease;
  overflow:hidden;
}
.ticket:active{transform:scale(0.985);}

.ticket-main{
  display:flex;
  align-items:center;
  padding:18px 18px 16px;
  gap:14px;
}
.route{
  flex:1;
  display:flex;
  align-items:center;
  gap:10px;
  min-width:0;
}
.route .city{
  font-family:'Archivo',sans-serif;
  font-weight:700;
  font-size:16.5px;
  line-height:1.15;
  min-width:0;
}
.route .city span{
  display:block;
  font-family:'IBM Plex Mono',monospace;
  font-size:10px;
  font-weight:500;
  letter-spacing:.08em;
  color:var(--text-mute);
  text-transform:uppercase;
  margin-bottom:2px;
}
.route .plane-track{
  flex:1;
  position:relative;
  height:1px;
  background:repeating-linear-gradient(to right, var(--line) 0 6px, transparent 6px 11px);
  margin:0 2px;
}
.route .plane-track:after{
  content:'✈';
  position:absolute;
  top:50%; left:50%;
  transform:translate(-50%,-50%);
  font-size:13px;
  color:var(--gold-deep);
  background:var(--paper);
  padding:0 4px;
}
.ticket-legs{
  padding:0 18px 12px;
  display:flex;
  flex-direction:column;
  gap:3px;
}
.ticket-leg-row{
  display:flex;
  justify-content:space-between;
  align-items:baseline;
  gap:10px;
}
.ticket-leg-time{
  font-family:'IBM Plex Mono',monospace;
  font-size:11px;
  color:var(--text-mute);
  white-space:nowrap;
}
.ticket-leg-route{
  font-family:'Archivo',sans-serif;
  font-weight:600;
  font-size:12.5px;
  color:var(--text-dark);
  text-align:right;
}
.ticket-total{
  margin:0 18px 14px;
  background:linear-gradient(135deg, rgba(200,155,60,0.18), rgba(200,155,60,0.08));
  border:1px solid rgba(200,155,60,0.4);
  border-radius:10px;
  padding:8px 12px;
  display:flex;
  justify-content:space-between;
  align-items:center;
}
.ticket-total .label{
  font-family:'IBM Plex Mono',monospace;
  font-size:10px;
  text-transform:uppercase;
  letter-spacing:.06em;
  color:var(--gold-deep);
}
.ticket-total .amt{
  font-family:'Archivo',sans-serif;
  font-weight:800;
  font-size:15px;
  text-align:right;
  color:var(--gold-deep);
}
.perf{
  position:relative;
  height:0;
  border-top:1.5px dashed var(--line);
  margin:0 18px;
}
.perf:before,.perf:after{
  content:'';
  position:absolute;
  top:-9px;
  width:18px; height:18px;
  border-radius:50%;
  background:var(--ink);
}
.perf:before{left:-27px;}
.perf:after{right:-27px;}

.ticket-foot{
  display:flex;
  justify-content:space-between;
  align-items:center;
  padding:12px 18px 14px;
  font-family:'IBM Plex Mono',monospace;
  font-size:11px;
  color:var(--text-mute);
}
.ticket-foot .badges{display:flex; gap:6px; align-items:center; flex-wrap:wrap;}
.mini-badge{
  background:var(--paper-2);
  border-radius:999px;
  padding:3px 9px;
  font-size:10.5px;
}
.mini-badge.part-badge{
  background:rgba(60,90,140,0.12);
  color:#3c5a8c;
}
.mini-badge.luogo-badge{
  background:rgba(70,120,80,0.14);
  color:var(--ok);
}
.ticket-foot .badges{flex:1; min-width:0;}
.ticket-foot > :last-child{flex-shrink:0; margin-left:8px;}
.mini-badge.da-pagare-badge{
  background:rgba(182,92,56,0.14);
  color:var(--danger);
  font-weight:600;
  font-family:'IBM Plex Mono',monospace;
}
.confirmed-stamp{
  font-family:'Archivo',sans-serif;
  font-size:9.5px;
  font-weight:800;
  letter-spacing:.09em;
  color:var(--ok);
  border:1.4px solid var(--ok);
  border-radius:5px;
  padding:2px 6px;
  transform:rotate(-4deg);
  text-transform:uppercase;
  white-space:nowrap;
}
.pending-tag{
  font-family:'IBM Plex Mono',monospace;
  font-size:9.5px;
  color:var(--text-mute);
  border:1px dashed var(--line);
  border-radius:5px;
  padding:2px 6px;
  text-transform:uppercase;
  letter-spacing:.06em;
  white-space:nowrap;
}
.done-tag{
  font-family:'IBM Plex Mono',monospace;
  font-size:9.5px;
  font-weight:700;
  color:var(--text-mute);
  background:var(--paper-2);
  border:1px solid var(--line);
  border-radius:5px;
  padding:2px 6px;
  text-transform:uppercase;
  letter-spacing:.06em;
  white-space:nowrap;
}

.empty-state{
  text-align:center;
  padding:60px 24px;
  color:var(--slate-2);
  font-size:14px;
}

/* Overlay + sheet (riusato per dettaglio e menu) */
.overlay{
  position:fixed; inset:0;
  background:rgba(6,10,18,0.6);
  backdrop-filter:blur(2px);
  opacity:0; pointer-events:none;
  transition:opacity .22s ease;
  z-index:40;
}
.overlay.open{opacity:1; pointer-events:auto;}

.sheet{
  position:fixed;
  left:0; right:0; bottom:0;
  max-height:92vh;
  background:var(--ink);
  border-radius:26px 26px 0 0;
  transform:translateY(100%);
  transition:transform .28s cubic-bezier(.22,.8,.32,1);
  z-index:41;
  overflow-y:auto;
  padding-bottom:env(safe-area-inset-bottom,24px);
  box-shadow:0 -20px 60px rgba(0,0,0,0.5);
}
.sheet.open{transform:translateY(0);}
.sheet-handle{
  width:40px; height:4px;
  background:rgba(255,255,255,0.2);
  border-radius:4px;
  margin:12px auto 4px;
}
.sheet-close{
  position:absolute;
  top:16px; right:16px;
  width:34px; height:34px;
  border-radius:50%;
  background:rgba(255,255,255,0.08);
  border:none;
  color:var(--paper);
  font-size:16px;
  display:flex; align-items:center; justify-content:center;
  cursor:pointer;
  z-index:2;
}

.sheet-header{padding:18px 60px 4px 22px;}
.sheet-header .eyebrow{
  font-family:'IBM Plex Mono',monospace;
  font-size:10.5px;
  letter-spacing:.14em;
  text-transform:uppercase;
  color:var(--gold);
  margin:0 0 6px;
}
.sheet-header h2{
  font-family:'Archivo',sans-serif;
  font-size:24px;
  font-weight:800;
  margin:0 0 4px;
  color:var(--paper);
}
.sheet-header .status-line{
  display:flex; gap:8px; align-items:center; flex-wrap:wrap;
  margin:10px 0 4px;
  font-family:'IBM Plex Mono',monospace;
  font-size:12px;
  color:var(--slate-2);
}
.action-row{
  display:flex; gap:8px; flex-wrap:wrap;
  padding:14px 22px 0;
}
.btn{
  font-family:'IBM Plex Mono',monospace;
  font-size:12px;
  font-weight:600;
  padding:9px 14px;
  border-radius:10px;
  border:1px solid rgba(255,255,255,0.16);
  background:rgba(255,255,255,0.05);
  color:var(--paper);
  cursor:pointer;
}
.btn.primary{background:var(--gold); border-color:var(--gold); color:var(--ink);}
.btn.danger{background:rgba(182,92,56,0.15); border-color:var(--danger); color:#E3A98C;}
.btn.ghost{background:transparent;}
.btn:active{opacity:.8;}

.section{padding:18px 22px 6px;}
.section-title{
  font-family:'IBM Plex Mono',monospace;
  font-size:11px;
  letter-spacing:.1em;
  text-transform:uppercase;
  color:var(--gold);
  margin:0 0 12px;
  display:flex;
  align-items:center;
  gap:8px;
}
.section-title:after{content:''; flex:1; height:1px; background:rgba(255,255,255,0.1);}

.leg-card{
  background:var(--paper);
  border-radius:16px;
  color:var(--text-dark);
  padding:16px 16px 14px;
  margin-bottom:12px;
}
.leg-top{display:flex; justify-content:space-between; align-items:flex-start; gap:10px; margin-bottom:10px;}
.leg-route{font-family:'Archivo',sans-serif; font-weight:700; font-size:16px; display:flex; align-items:center; gap:8px;}
.leg-route .arrow{color:var(--gold-deep); font-size:14px;}
.leg-when{text-align:right; font-family:'IBM Plex Mono',monospace;}
.leg-when .d{font-size:12.5px; font-weight:600;}
.leg-when .t{font-size:11px; color:var(--text-mute);}
.leg-row{display:flex; justify-content:space-between; font-size:12.5px; padding:4px 0; border-top:1px solid var(--paper-2); color:var(--text-mute);}
.leg-row:first-of-type{border-top:none; margin-top:2px;}
.leg-row .val{font-family:'IBM Plex Mono',monospace; color:var(--text-dark); text-align:right;}
.leg-note{margin-top:8px; background:#F3E3DA; color:var(--danger); font-size:11.5px; padding:6px 10px; border-radius:8px; font-weight:600;}

.hotel-card{
  background:rgba(255,255,255,0.04);
  border:1px solid rgba(255,255,255,0.09);
  border-radius:16px;
  padding:14px 16px;
  margin-bottom:10px;
}
.hotel-top{display:flex; justify-content:space-between; align-items:flex-start; gap:10px;}
.hotel-name{font-family:'Archivo',sans-serif; font-weight:700; font-size:14.5px; color:var(--paper);}
.hotel-price{font-family:'IBM Plex Mono',monospace; font-weight:600; color:var(--gold); font-size:14px; white-space:nowrap;}
.rivalutato{
  display:block;
  font-family:'IBM Plex Mono',monospace;
  font-size:10px;
  font-weight:500;
  color:var(--text-mute);
  white-space:nowrap;
  margin-top:1px;
}
.rivalutato.on-dark{ color:var(--slate-2); }
.hotel-sub{font-size:11.5px; color:var(--slate-2); margin-top:6px; display:flex; gap:10px; flex-wrap:wrap;}
.hotel-alt-tag{display:inline-block; margin-top:8px; font-family:'IBM Plex Mono',monospace; font-size:10px; letter-spacing:.05em; text-transform:uppercase; background:rgba(200,155,60,0.15); color:var(--gold); padding:3px 8px; border-radius:6px;}

.total-row{display:flex; justify-content:space-between; align-items:center; padding:16px 22px 28px; margin-top:6px;}
.total-row .label{font-size:12.5px; color:var(--slate-2); text-transform:uppercase; letter-spacing:.06em; font-family:'IBM Plex Mono',monospace;}
.total-row .amount{font-family:'Archivo',sans-serif; font-weight:800; font-size:24px; color:var(--paper);}

.subtotal-row{display:flex; justify-content:space-between; align-items:center; padding:0 22px 10px;}
.subtotal-row .label{font-size:11.5px; color:var(--slate-2); text-transform:uppercase; letter-spacing:.06em; font-family:'IBM Plex Mono',monospace;}
.subtotal-row .amt{font-family:'IBM Plex Mono',monospace; font-weight:600; font-size:14px; color:var(--slate-2);}
.subtotal-row.emphasis{padding-bottom:22px;}
.subtotal-row.emphasis .label{color:var(--gold-deep); font-weight:600;}
.subtotal-row.emphasis .amt{color:var(--gold); font-weight:700; font-size:15px;}

/* Edit form */
.field-grid{display:grid; grid-template-columns:1fr 1fr; gap:8px;}
.field{margin-bottom:8px;}
.field.full{grid-column:1/-1;}
.field label{display:block; font-family:'IBM Plex Mono',monospace; font-size:10px; text-transform:uppercase; letter-spacing:.05em; color:var(--text-mute); margin-bottom:4px;}
.field input, .field select{
  width:100%;
  padding:9px 10px;
  border-radius:9px;
  border:1px solid var(--line);
  background:#fff;
  color:var(--text-dark);
  font-size:13px;
}
.edit-card{background:var(--paper); border-radius:16px; padding:14px; margin-bottom:12px; color:var(--text-dark);}
.edit-card-head{display:flex; justify-content:space-between; align-items:center; margin-bottom:8px;}
.edit-card-head .idx{font-family:'IBM Plex Mono',monospace; font-size:11px; color:var(--text-mute); text-transform:uppercase; letter-spacing:.06em;}
.remove-mini{background:none; border:none; color:var(--danger); font-size:11px; font-family:'IBM Plex Mono',monospace; font-weight:600; cursor:pointer;}
.add-card-btn{width:100%; padding:12px; border-radius:12px; border:1.5px dashed rgba(255,255,255,0.25); background:transparent; color:var(--slate-2); font-size:12.5px; font-weight:600; cursor:pointer; margin-bottom:10px;}
.checkbox-field{display:flex; align-items:center; gap:8px; padding:4px 0 12px;}
.checkbox-field input{width:18px; height:18px;}
.checkbox-field label{font-size:13px; color:var(--paper); font-family:'Inter',sans-serif;}

/* Riepilogo per destinazione */
.summary-checks{display:flex; flex-direction:column; gap:10px;}
.summary-checks label{display:flex; align-items:center; gap:9px; font-size:13.5px; color:var(--paper); font-family:'Inter',sans-serif;}
.summary-checks input{width:18px; height:18px; flex-shrink:0;}
.dest-checklist{
  max-height:220px;
  overflow-y:auto;
  display:flex;
  flex-direction:column;
  gap:8px;
  padding:4px 2px;
  border:1px solid rgba(255,255,255,0.1);
  border-radius:12px;
  padding:10px 12px;
}
.dest-checklist label{display:flex; align-items:center; gap:9px; font-size:13px; color:var(--paper); font-family:'Inter',sans-serif;}
.dest-checklist input{width:16px; height:16px; flex-shrink:0;}
.pivot-total{font-family:'IBM Plex Mono',monospace; font-size:12px; color:var(--slate-2); margin-bottom:12px;}
.pivot-row{
  display:flex; justify-content:space-between; align-items:center;
  padding:11px 14px; margin-bottom:8px;
  background:rgba(255,255,255,0.04);
  border:1px solid rgba(255,255,255,0.08);
  border-radius:10px;
}
.pivot-dest{font-family:'Archivo',sans-serif; font-weight:600; font-size:14px; color:var(--paper);}
.pivot-count{font-family:'IBM Plex Mono',monospace; font-weight:700; font-size:15px; color:var(--gold);}

/* Atlante */
.atlas-map-wrap{
  margin:4px 16px 14px;
  border-radius:16px;
  overflow:hidden;
  background:#0A1420;
  border:1px solid rgba(255,255,255,0.1);
}
.atlas-map-wrap svg{display:block; width:100%; height:auto;}
.atlas-country{stroke:#0A1420; stroke-width:0.4; cursor:pointer; transition:opacity .15s;}
.atlas-country:active{opacity:0.7;}
.atlas-country.unvisited{fill:#1C2A3D;}
.atlas-pin{cursor:pointer;}
.atlas-pin circle{stroke:#0A1420; stroke-width:0.6;}
.atlas-pin-label{
  font-family:'IBM Plex Mono',monospace;
  font-size:6.5px;
  fill:var(--paper);
  paint-order:stroke;
  stroke:#0A1420;
  stroke-width:1.2px;
}
.atlas-back-btn{
  margin:0 16px 10px;
  font-family:'IBM Plex Mono',monospace;
  font-size:12px;
  font-weight:600;
  padding:8px 14px;
  border-radius:10px;
  border:1px solid rgba(255,255,255,0.16);
  background:rgba(255,255,255,0.05);
  color:var(--paper);
  cursor:pointer;
}
.atlas-legend{
  display:flex; align-items:center; gap:8px;
  margin:0 20px 10px;
  font-family:'IBM Plex Mono',monospace;
  font-size:10.5px;
  color:var(--slate-2);
}
.atlas-legend .swatch{width:14px; height:14px; border-radius:3px; flex-shrink:0;}
.atlas-regions-list{margin:0 16px 14px; display:flex; flex-direction:column; gap:6px;}
.atlas-region-row{
  display:flex; justify-content:space-between; align-items:center;
  padding:8px 12px;
  background:rgba(255,255,255,0.04);
  border-radius:8px;
  font-size:12.5px;
}
.atlas-region-row .name{color:var(--paper); font-family:'Inter',sans-serif;}
.atlas-region-row .n{font-family:'IBM Plex Mono',monospace; color:var(--gold); font-weight:600;}
.atlas-note{margin:0 20px 14px; font-size:11.5px; color:var(--slate-2); line-height:1.5;}
.atlas-fallback-list{margin:0 16px 14px; display:flex; flex-direction:column; gap:8px;}

/* Menu sheet */
.menu-item{
  display:flex; align-items:center; gap:12px;
  width:100%;
  padding:14px 22px;
  background:none; border:none;
  border-bottom:1px solid rgba(255,255,255,0.06);
  color:var(--paper);
  font-size:14.5px;
  text-align:left;
  cursor:pointer;
}
.menu-item .ic{font-size:17px; width:22px; text-align:center;}
.menu-item .desc{display:block; font-size:11.5px; color:var(--slate-2); margin-top:2px;}
.menu-item.danger{color:#E3A98C;}

/* JSON modal */
.modal-overlay{
  position:fixed; inset:0; background:rgba(6,10,18,0.7);
  display:none; align-items:center; justify-content:center; z-index:60; padding:20px;
}
.modal-overlay.open{display:flex;}
.modal-box{
  background:var(--ink); border:1px solid rgba(255,255,255,0.1);
  border-radius:18px; width:100%; max-width:600px; max-height:80vh;
  display:flex; flex-direction:column; overflow:hidden;
}
.modal-box .mh{padding:16px 18px; display:flex; justify-content:space-between; align-items:center; border-bottom:1px solid rgba(255,255,255,0.08);}
.modal-box .mh h3{margin:0; font-family:'Archivo',sans-serif; font-size:16px;}
.modal-box textarea{
  flex:1; min-height:260px; margin:14px 18px 0; padding:12px;
  background:#0A1420; color:#B9E6C4; border:1px solid rgba(255,255,255,0.1);
  border-radius:10px; font-family:'IBM Plex Mono',monospace; font-size:11px; resize:vertical;
}
.modal-box .mf{padding:14px 18px 18px; display:flex; gap:8px; justify-content:flex-end;}

.toast{
  position:fixed; left:50%; bottom:26px; transform:translate(-50%,20px);
  background:var(--paper); color:var(--text-dark); padding:11px 18px;
  border-radius:12px; font-size:13px; font-weight:600;
  box-shadow:0 12px 30px rgba(0,0,0,0.4);
  opacity:0; pointer-events:none; transition:all .25s ease; z-index:80;
  max-width:88vw; text-align:center;
}
.toast.show{opacity:1; transform:translate(-50%,0);}

#fileInputExcel, #fileInputJson{display:none;}

@media (min-width:600px){
  .list{max-width:640px; margin:0 auto;}
  header.top, .stats-row, .filters, .dest-filter, .sort-row{max-width:640px; margin-left:auto; margin-right:auto;}
  .sheet{max-width:640px; left:50%; transform:translate(-50%,100%);}
  .sheet.open{transform:translate(-50%,0);}
}

<body>

<header class="top">
  <div>
    <p class="eyebrow">Itinerario</p>
    <h1>Viaggi</h1>
    <p class="sub" id="subCount">— viaggi in programma</p>
  </div>
  <div style="display:flex; gap:8px;">
    <button class="menu-btn" id="atlasBtn" aria-label="Atlante dei luoghi visitati">🗺️</button>
    <button class="menu-btn" id="summaryBtn" aria-label="Riepilogo per destinazione">📊</button>
    <button class="menu-btn" id="menuBtn" aria-label="Menu">☰</button>
  </div>
</header>

<div class="stats-row" id="statsRow"></div>

<div class="filters" id="filters">
  <button class="filter-btn active" data-f="prossimi">Prossimi</button>
  <button class="filter-btn" data-f="confermati">Confermati</button>
  <button class="filter-btn" data-f="attesa">Da confermare</button>
  <button class="filter-btn" data-f="effettuati">Effettuati</button>
  <button class="filter-btn" data-f="tutti">Tutti</button>
</div>

<div class="dest-filter">
  <input type="text" id="destFilter" list="destList" placeholder="Filtra per destinazione…" autocomplete="off">
  <datalist id="destList"></datalist>
  <button id="destClear" aria-label="Cancella filtro destinazione">✕</button>
</div>

<div class="sort-row">
  <label for="sortSelect">Ordina per</label>
  <select id="sortSelect">
    <option value="data">Data (crescente)</option>
    <option value="totale">Totale viaggio (dal più caro)</option>
    <option value="hotel">Costo hotel (dal più caro)</option>
    <option value="voli">Costo voli (dal più caro)</option>
  </select>
</div>

<div class="filters" id="partecipantiFilters" style="margin-top:10px;">
  <button class="filter-btn" data-p="Filippo/Laura">Filippo/Laura</button>
  <button class="filter-btn" data-p="Massimo/Mina">Massimo/Mina</button>
  <button class="filter-btn" data-p="Angela">Angela</button>
  <button class="filter-btn" data-p="Altri">Altri</button>
</div>

<div class="list" id="list"></div>
<button class="new-trip-btn" id="newTripBtn">+ Nuovo viaggio</button>

<!-- Dettaglio / edit viaggio -->
<div class="overlay" id="overlay"></div>
<div class="sheet" id="sheet">
  <div class="sheet-handle"></div>
  <button class="sheet-close" id="sheetClose">✕</button>
  <div id="sheetContent"></div>
</div>

<!-- Menu -->
<div class="overlay" id="menuOverlay"></div>
<div class="sheet" id="menuSheet">
  <div class="sheet-handle"></div>
  <button class="sheet-close" id="menuClose">✕</button>
  <div class="sheet-header" style="padding-top:14px;">
    <p class="eyebrow">Dati</p>
    <h2 style="font-size:20px;">Gestione dati</h2>
  </div>
  <div style="padding-top:8px;">
    <button class="menu-item" id="mImportExcel"><span class="ic">📥</span><span><b>Importa da Excel</b><span class="desc">Sostituisce i viaggi con quelli del foglio (.xlsx)</span></span></button>
    <button class="menu-item" id="mExportExcel"><span class="ic">📤</span><span><b>Esporta in Excel</b><span class="desc">Scarica il file .xlsx aggiornato</span></span></button>
    <button class="menu-item" id="mExportJsonFile"><span class="ic">🗂️</span><span><b>Esporta JSON (file)</b><span class="desc">Scarica viaggi.json</span></span></button>
    <button class="menu-item" id="mShowJson"><span class="ic">{ }</span><span><b>Mostra JSON (testo)</b><span class="desc">Visualizza e copia il JSON</span></span></button>
    <button class="menu-item" id="mImportJson"><span class="ic">📋</span><span><b>Importa JSON</b><span class="desc">Ripristina da un backup .json</span></span></button>
    <button class="menu-item" id="mEnablePush"><span class="ic">🔔</span><span><b>Notifiche cancellazione hotel</b><span class="desc">Avviso alle 10:00 quando mancano 1-3 giorni alla scadenza</span></span></button>
    <button class="menu-item danger" id="mReset"><span class="ic">↺</span><span><b>Ripristina dati di esempio</b><span class="desc">Torna ai dati originali del foglio</span></span></button>
  </div>
</div>

<!-- Atlante dei luoghi visitati -->
<div class="overlay" id="atlasOverlay"></div>
<div class="sheet" id="atlasSheet">
  <div class="sheet-handle"></div>
  <button class="sheet-close" id="atlasClose">✕</button>
  <div class="sheet-header" style="padding-top:14px;">
    <p class="eyebrow" id="atlasEyebrow">Atlante</p>
    <h2 style="font-size:20px;" id="atlasTitle">Luoghi visitati</h2>
  </div>
  <div id="atlasBody"></div>
</div>

<!-- Riepilogo per destinazione -->
<div class="overlay" id="summaryOverlay"></div>
<div class="sheet" id="summarySheet">
  <div class="sheet-handle"></div>
  <button class="sheet-close" id="summaryClose">✕</button>
  <div class="sheet-header" style="padding-top:14px;">
    <p class="eyebrow">Riepilogo</p>
    <h2 style="font-size:20px;">Viaggi per destinazione</h2>
  </div>
  <div class="section">
    <p class="section-title">Tipo viaggio</p>
    <div class="summary-checks">
      <label><input type="checkbox" class="summary-stato" value="confermato" checked> Confermato</label>
      <label><input type="checkbox" class="summary-stato" value="attesa" checked> Da confermare (programmato)</label>
      <label><input type="checkbox" class="summary-stato" value="effettuato" checked> Effettuato</label>
    </div>
  </div>
  <div class="section">
    <p class="section-title">Destinazione</p>
    <div class="action-row" style="padding:0 0 10px;">
      <button class="btn ghost" id="summarySelAll" type="button">Seleziona tutte</button>
      <button class="btn ghost" id="summarySelNone" type="button">Deseleziona tutte</button>
    </div>
    <div id="summaryDestList" class="dest-checklist"></div>
  </div>
  <div class="section" style="padding-bottom:28px;">
    <p class="section-title">Risultato</p>
    <div id="summaryResult"></div>
  </div>
</div>

<input type="file" id="fileInputExcel" accept=".xlsx,.xls">
<input type="file" id="fileInputJson" accept=".json,application/json">

<!-- Modal JSON testo -->
<div class="modal-overlay" id="jsonModalOverlay">
  <div class="modal-box">
    <div class="mh"><h3>JSON viaggi</h3><button class="sheet-close" style="position:static" id="jsonModalClose">✕</button></div>
    <textarea id="jsonText" readonly></textarea>
    <div class="mf">
      <button class="btn" id="jsonCopyBtn">Copia negli appunti</button>
      <button class="btn primary" id="jsonModalOk">Chiudi</button>
    </div>
  </div>
</div>

function urlBase64ToUint8Array(base64String){
  const padding = '='.repeat((4 - base64String.length % 4) % 4);
  const base64 = (base64String + padding).replace(/-/g,'+').replace(/_/g,'/');
  const raw = atob(base64);
  const arr = new Uint8Array(raw.length);
  for(let i=0;i<raw.length;i++) arr[i] = raw.charCodeAt(i);
  return arr;
}

async function enablePushNotifications(){
  if(!('serviceWorker' in navigator) || !('PushManager' in window)){
    showToast('Le notifiche push non sono supportate su questo browser');
    return;
  }
  try{
    const permission = await Notification.requestPermission();
    if(permission !== 'granted'){
      showToast('Permesso notifiche negato');
      return;
    }
    const reg = await navigator.serviceWorker.ready;
    let sub = await reg.pushManager.getSubscription();
    if(!sub){
      try{
        sub = await reg.pushManager.subscribe({
          userVisibleOnly: true,
          applicationServerKey: urlBase64ToUint8Array(VAPID_PUBLIC_KEY),
        });
      }catch(subErr){
        console.error(subErr);
        showToast('Iscrizione push rifiutata dal browser: ' + (subErr && subErr.message ? subErr.message : subErr));
        return;
      }
    }
    let res;
    try{
      res = await fetch('/.netlify/functions/subscribe', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', 'x-app-secret': APP_SECRET },
        body: JSON.stringify(sub),
      });
    }catch(netErr){
      console.error(netErr);
      showToast('Impossibile contattare il backend (errore di rete)');
      return;
    }
    if(!res.ok){
      const bodyText = await res.text().catch(()=> '');
      console.error('subscribe fallita', res.status, bodyText);
      if(res.status === 401){
        showToast('Backend raggiunto ma APP_SECRET non corrisponde (controlla la variabile su Netlify)');
      } else if(res.status === 404){
        showToast('Funzione subscribe non trovata (404) — verifica il deploy');
      } else {
        showToast(`Errore dal backend: ${res.status} ${bodyText}`.slice(0,120));
      }
      return;
    }
    localStorage.setItem(PUSH_FLAG_KEY, '1');
    await syncTripsToServer();
    showToast('Notifiche attivate');
  }catch(e){
    console.error(e);
    showToast('Errore imprevisto: ' + (e && e.message ? e.message : e));
  }
}
function isPushEnabled(){

        try{

}

// Migra i viaggi salvati con la vecchia struttura (parcheggio/trasporto
// annidati dentro le tratte) verso i nuovi array indipendenti t.parcheggi/t.trasporti.
function ensurePrepagato(item, costo, defaultPrepagato){
  if(item.prepagato===undefined) item.prepagato = defaultPrepagato;
  if(item.daPagare===undefined) item.daPagare = item.prepagato ? 0 : (costo ?? null);
}
function migrateTrip(t){
  if(!Array.isArray(t.parcheggi)) t.parcheggi = [];
  if(!Array.isArray(t.trasporti)) t.trasporti = [];
  (t.legs||[]).forEach(leg=>{
    const hasParcheggio = leg.parcheggioTipo!=null || leg.parcheggioPrezzo!=null || leg.parcheggioCodice!=null;
    const hasTrasporto = leg.trasporto!=null || leg.trasportoCosto!=null;
    if(hasParcheggio){
      t.parcheggi.push({ tipo: leg.parcheggioTipo??null, codice: leg.parcheggioCodice??null, prezzo: leg.parcheggioPrezzo??null });
    }
    if(hasTrasporto){
      t.trasporti.push({ nome: leg.trasporto??null, costo: leg.trasportoCosto??null });
    }
    delete leg.parcheggioTipo; delete leg.parcheggioPrezzo; delete leg.parcheggioCodice;
    delete leg.trasporto; delete leg.trasportoCosto;
  });
  (t.legs||[]).forEach(leg=> ensurePrepagato(leg, leg.prezzo, true));
  t.parcheggi.forEach(p=> ensurePrepagato(p, p.prezzo, false));
  t.trasporti.forEach(tr=> ensurePrepagato(tr, tr.costo, false));
  (t.hotels||[]).forEach(h=> ensurePrepagato(h, h.prezzo, false));
  if(!Array.isArray(t.luoghi)) t.luoghi = [];
  if(!Array.isArray(t.partecipanti)) t.partecipanti = [];
  return t;
}
function migrateTrips(arr){
  return (arr||[]).map(migrateTrip);
}

function loadTrips(){
  try{
    const raw = localStorage.getItem(STORAGE_KEY);
    if(raw){
      const parsed = JSON.parse(raw);
      if(Array.isArray(parsed)) return migrateTrips(parsed);
    }
  }catch(e){}
  return migrateTrips(JSON.parse(JSON.stringify(DEFAULT_TRIPS)));
}

const eur = n => n===null||n===undefined ? null : '€ ' + fmt2(n);
const pad2 = n => String(n).padStart(2,'0');

/* ======================= ATTUALIZZAZIONE (ISTAT FOI) ======================= */
// Coefficienti calcolati concatenando le variazioni % annue dell'indice ISTAT
// FOI (senza tabacchi) - fonte: rivaluta.it - fino al 2026 (anno di riferimento
// "oggi"). Vanno aggiornati una volta l'anno aggiungendo la variazione più
// recente e ricalcolando ANNO_RIFERIMENTO. Anni successivi al riferimento
// (prenotazioni future) non vengono attualizzati (coefficiente 1).
const ANNO_RIFERIMENTO = 2026;
const COEFF_RIVALUTAZIONE = {
  2014: 1.2263, 2015: 1.2288, 2016: 1.2300, 2017: 1.2155, 2018: 1.2022,
  2019: 1.1974, 2020: 1.1998, 2021: 1.1786, 2022: 1.0913, 2023: 1.0354,
  2024: 1.0262, 2025: 1.0120, 2026: 1.0000,
};
function coeffPerAnno(anno){
  if(anno==null) return 1;
  if(anno >= ANNO_RIFERIMENTO) return 1;
  if(anno <= 2014) return COEFF_RIVALUTAZIONE[2014];
  return COEFF_RIVALUTAZIONE[anno] ?? 1;
}
function valoreAttualizzato(prezzo, anno){
  if(prezzo==null || anno==null) return null;
  const c = coeffPerAnno(anno);
  if(c===1) return null; // stesso anno di riferimento: nessuna differenza da mostrare
  return Math.round(prezzo*c*100)/100;
}
// Piccola annotazione "≈ € X oggi" da affiancare a un prezzo, se l'anno è diverso da quello corrente.
function attualizzatoHtml(prezzo, anno, dark){
  const val = valoreAttualizzato(prezzo, anno);
  if(val==null) return '';
  return `<span class="rivalutato${dark? ' on-dark':''}">≈ ${eur(val)} oggi</span>`;
}
function annoDaIso(iso){
  if(!iso) return null;
  const m = /^(\d{4})-/.exec(iso);
  return m ? parseInt(m[1],10) : null;
}

function dayLabel(iso){
  if(!iso) return '';
  const d = new Date(iso+'T12:00:00');
  if(isNaN(d)) return '';
  const giorni = ['dom','lun','mar','mer','gio','ven','sab'];
  return giorni[d.getDay()];
}
function isoToDisp(iso){
  if(!iso) return null;
  const [y,m,d] = iso.split('-');
  return `${d}/${m}/${y}`;
}
function dispToIso(disp){
  const m = /^(\d{2})\/(\d{2})\/(\d{4})$/.exec(disp||'');
  if(!m) return null;
  return `${m[3]}-${m[2]}-${m[1]}`;
}
function isoToExcelDate(iso){
  if(!iso) return null;
  const [y,m,d] = iso.split('-');
  return `${d}.${m}.${y}`;
}
function capWords(s){
  if(s===null||s===undefined) return null;
  s = String(s).trim();
  if(!s) return null;
  return s.toLowerCase().split(' ').filter(Boolean).map(w=> w.charAt(0).toUpperCase()+w.slice(1)).join(' ');
}
function toNum(v){
  if(v===null||v===undefined||v==='') return null;
  if(typeof v === 'number') return isNaN(v)? null : v;
  const n = parseFloat(String(v).replace(',','.'));
  return isNaN(n) ? null : n;
}
function showToast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(showToast._tm);
  const duration = msg && msg.length > 60 ? 5500 : 2600;
  showToast._tm = setTimeout(()=> t.classList.remove('show'), duration);
}

function todayIso(){
  const d = new Date();
  return `${d.getFullYear()}-${pad2(d.getMonth()+1)}-${pad2(d.getDate())}`;
}
// Stato del viaggio: 'effettuato' se la partenza è già passata, altrimenti
// 'confermato' o 'attesa' in base alla colonna Confermato (A) del foglio.
function tripStatus(t){
  const today = todayIso();
  if(t.dataIso && t.dataIso < today) return 'effettuato';
  return t.confermato ? 'confermato' : 'attesa';
}
function statusLabel(status){
  if(status==='effettuato') return 'Effettuato';
  if(status==='confermato') return 'Confermato';
  return 'Da confermare';
}
function statusBadgeHtml(status){
  if(status==='effettuato') return `<span class="done-tag">Effettuato</span>`;
  if(status==='confermato') return `<span class="confirmed-stamp">Confermato</span>`;
  return `<span class="pending-tag">Da confermare</span>`;
}

/* ======================= PARSING EXCEL -> TRIPS ======================= */
function parseDateCellJs(v){
  if(v===null || v===undefined || v==='') return {iso:null, disp:null};
  if(v instanceof Date){
    const y=v.getUTCFullYear(), m=v.getUTCMonth()+1, d=v.getUTCDate();
    return {iso:`${y}-${pad2(m)}-${pad2(d)}`, disp:`${pad2(d)}/${pad2(m)}/${y}`};
  }
  if(typeof v === 'number'){
    const ms = Date.UTC(1899,11,30) + Math.round(v)*86400000;
    const dt = new Date(ms);
    const y=dt.getUTCFullYear(), m=dt.getUTCMonth()+1, d=dt.getUTCDate();
    return {iso:`${y}-${pad2(m)}-${pad2(d)}`, disp:`${pad2(d)}/${pad2(m)}/${y}`};
  }
  const s = String(v).trim();
  let mm = /^(\d{1,2})\.(\d{1,2})\.(\d{4})$/.exec(s);
  if(mm){ const [,d,m,y]=mm; return {iso:`${y}-${pad2(m)}-${pad2(d)}`, disp:`${pad2(d)}/${pad2(m)}/${y}`}; }
  mm = /^(\d{1,2})\/(\d{1,2})\/(\d{4})$/.exec(s);
  if(mm){ const [,d,m,y]=mm; return {iso:`${y}-${pad2(m)}-${pad2(d)}`, disp:`${pad2(d)}/${pad2(m)}/${y}`}; }
  return {iso:null, disp:s};
}
function fmtShortDateJs(v){
  if(v===null||v===undefined||v==='') return null;
  if(v instanceof Date) return `${pad2(v.getUTCDate())}.${pad2(v.getUTCMonth()+1)}`;
  if(typeof v === 'number'){
    const s = v.toFixed(2);
    const [day,month] = s.split('.');
    return `${pad2(parseInt(day,10))}.${pad2(parseInt(month,10))}`;
  }
  const s = String(v).trim();
  const m = /^(\d{1,2})\.(\d{1,2})/.exec(s);
  if(m) return `${pad2(parseInt(m[1],10))}.${pad2(parseInt(m[2],10))}`;
  return s;
}

function computeTripFromBlock(block, id){
  const first = block[0];
  const {iso, disp} = parseDateCellJs(first['Data']);
  let persone = null;
  for(const r of block){ if(r['Persone']!==null && r['Persone']!==undefined && r['Persone']!==''){ persone = Math.round(toNum(r['Persone'])); break; } }
  const partecipanti = (first['Partecipanti aggiuntivi'] || '').toString().split(',').map(s=>s.trim()).filter(Boolean);
  const luoghi = [];
  block.forEach(r=>{
    (r['Posti visitati'] || '').toString().split(',').map(x=>x.trim()).filter(Boolean).forEach(x=>{
      if(!luoghi.some(y=>y.toLowerCase()===x.toLowerCase())) luoghi.push(x);
    });
  });
  const legs = [], hotels = [], parcheggi = [], trasporti = [];
  let totSum = 0, hasTot = false;
  block.forEach(r=>{
    const hasRoute = (r['Partenza']!==null && r['Partenza']!==undefined && r['Partenza']!=='') || (r['Arrivo']!==null && r['Arrivo']!==undefined && r['Arrivo']!=='');
    if(hasRoute){
      const dd = parseDateCellJs(r['Data']);
      const legPrezzo = toNum(r['Prezzo biglietto']);
      legs.push({
        data: dd.disp, dataIso: dd.iso,
        orario: r['Orario'] || null,
        compagnia: capWords(r['Compagnia aerea']),
        codice: r['Codice prenotazione'] || null,
        prezzo: legPrezzo,
        partenza: capWords(r['Partenza']),
        arrivo: capWords(r['Arrivo']),
        totale: toNum(r['Totale']),
        note: r['Note'] || null,
        prepagato: true, daPagare: 0,
      });
    }
    if(r['Hotel'] !== null && r['Hotel'] !== undefined && r['Hotel'] !== ''){
      const hPrezzo = toNum(r['Prezzo hotel']);
      hotels.push({
        nome: r['Hotel'],
        prezzo: hPrezzo,
        cancellazione: fmtShortDateJs(r['Cancellazione hotel entro:']),
        note: r['Note'] || null,
        prepagato: false, daPagare: hPrezzo ?? null,
      });
    }
    const parkCodice = (r['Codice parcheggio']===''? null : r['Codice parcheggio']) ?? null;
    const parkPrezzo = toNum(r['Prezzo parcheggio']);
    const parkTipo = r['Tipo Parcheggio'] || null;
    if(parkCodice!=null || parkPrezzo!=null || parkTipo!=null){
      parcheggi.push({ tipo: parkTipo, codice: parkCodice, prezzo: parkPrezzo, prepagato: false, daPagare: parkPrezzo ?? null });
    }
    const trName = r['Trasporti'] || null;
    const trCosto = toNum(r['Costo trasporti']);
    if(trName!=null || trCosto!=null){
      trasporti.push({ nome: trName, costo: trCosto, prepagato: false, daPagare: trCosto ?? null });
    }
    const t = toNum(r['Totale']);
    if(t !== null){ totSum += t; hasTot = true; }
  });
  return {
    id,
    confermato: first['Confermato'] === 'SI',
    data: disp, dataIso: iso, orario: first['Orario'] || null,
    partenza: capWords(first['Partenza']), arrivo: capWords(first['Arrivo']),
    persone, legs, hotels, parcheggi, trasporti, luoghi, partecipanti,
    totale: hasTot ? Math.round(totSum*100)/100 : null
  };
}

function parseWorkbookToTrips(wb){
  const wsName = wb.SheetNames[0];
  const ws = wb.Sheets[wsName];
  const aoa = XLSX.utils.sheet_to_json(ws, {header:1, defval:null, raw:true});
  const dataRows = aoa.slice(1); // salta intestazione
  const rows = dataRows.map(arr=>{
    const o = {};
    FIELDS.forEach((f,i)=>{ const v = arr[i]; o[f] = (v===undefined || v==='') ? null : v; });
    return o;
  });
  const blocks = [];
  let cur = [];
  rows.forEach(o=>{
    const isBlank = FIELDS.every(f=> o[f]===null || o[f]===undefined || String(o[f]).trim()==='');
    if(isBlank){ if(cur.length){ blocks.push(cur); cur=[]; } }
    else cur.push(o);
  });
  if(cur.length) blocks.push(cur);
  if(!blocks.length) return null;
  return blocks.map((b,i)=> computeTripFromBlock(b, i+1));
}

/* ======================= EXPORT TRIPS -> EXCEL ======================= */
function tripsToAOA(trips){
  const aoa = [FIELDS];
  const sorted = trips.slice().sort((a,b)=> (a.dataIso||'').localeCompare(b.dataIso||''));
  sorted.forEach(t=>{
    const parcheggi = t.parcheggi || [];
    const trasporti = t.trasporti || [];
    const rows = [];
    t.legs.forEach((leg,i)=>{
      const row = {}; FIELDS.forEach(f=> row[f]=null);
      row['Data'] = leg.dataIso ? isoToExcelDate(leg.dataIso) : leg.data;
      row['Orario'] = leg.orario;
      row['Compagnia aerea'] = leg.compagnia;
      row['Codice prenotazione'] = leg.codice;
      row['Partenza'] = leg.partenza;
      row['Arrivo'] = leg.arrivo;
      row['Prezzo biglietto'] = leg.prezzo;
      row['Totale'] = leg.totale;
      row['Note'] = leg.note;
      if(i===0){
        row['Confermato'] = t.confermato ? 'SI' : null;
        row['Persone'] = t.persone;
        row['Partecipanti aggiuntivi'] = (t.partecipanti && t.partecipanti.length) ? t.partecipanti.join(', ') : null;
        row['Posti visitati'] = (t.luoghi && t.luoghi.length) ? t.luoghi.join(', ') : null;
      }
      const h = t.hotels[i];
      if(h){
        row['Hotel'] = h.nome; row['Prezzo hotel'] = h.prezzo;
        row['Cancellazione hotel entro:'] = h.cancellazione;
        if(h.note && !row['Note']) row['Note'] = h.note;
      }
      const p = parcheggi[i];
      if(p){
        row['Codice parcheggio'] = p.codice; row['Prezzo parcheggio'] = p.prezzo; row['Tipo Parcheggio'] = p.tipo;
      }
      const tr = trasporti[i];
      if(tr){
        row['Trasporti'] = tr.nome; row['Costo trasporti'] = tr.costo;
      }
      rows.push(row);
    });
    const extraCount = Math.max(t.hotels.length, parcheggi.length, trasporti.length, t.legs.length) - t.legs.length;
    for(let i=0; i<extraCount; i++){
      const idx = t.legs.length + i;
      const h = t.hotels[idx], p = parcheggi[idx], tr = trasporti[idx];
      if(!h && !p && !tr) continue;
      const row={}; FIELDS.forEach(f=>row[f]=null);
      if(h){ row['Hotel']=h.nome; row['Prezzo hotel']=h.prezzo; row['Cancellazione hotel entro:']=h.cancellazione; row['Note']=h.note; }
      if(p){ row['Codice parcheggio']=p.codice; row['Prezzo parcheggio']=p.prezzo; row['Tipo Parcheggio']=p.tipo; }
      if(tr){ row['Trasporti']=tr.nome; row['Costo trasporti']=tr.costo; }
      rows.push(row);
    }
    if(!rows.length){
      const row={}; FIELDS.forEach(f=>row[f]=null);
      row['Confermato']=t.confermato?'SI':null; row['Data']=t.dataIso?isoToExcelDate(t.dataIso):t.data;
      row['Orario']=t.orario; row['Partenza']=t.partenza; row['Arrivo']=t.arrivo; row['Persone']=t.persone;
      row['Partecipanti aggiuntivi'] = (t.partecipanti && t.partecipanti.length) ? t.partecipanti.join(', ') : null;
      row['Posti visitati'] = (t.luoghi && t.luoghi.length) ? t.luoghi.join(', ') : null;
      rows.push(row);
    }
    rows.forEach(r=> aoa.push(FIELDS.map(f=> r[f])));
    aoa.push(FIELDS.map(()=>null));
  });
  while(aoa.length && aoa[aoa.length-1].every(v=>v===null)) aoa.pop();
  return aoa;
}
function exportExcel(){
  try{
    const aoa = tripsToAOA(TRIPS);
    const ws = XLSX.utils.aoa_to_sheet(aoa);
    ws['!cols'] = FIELDS.map(()=>({wch:16}));
    const wb = XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(wb, ws, 'Viaggi');
    XLSX.writeFile(wb, 'Viaggi.xlsx');
    showToast('Excel esportato');
  }catch(e){ console.error(e); showToast('Errore durante l\'esportazione Excel'); }
}
function downloadJsonFile(){
  const blob = new Blob([JSON.stringify(TRIPS, null, 2)], {type:'application/json'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = 'viaggi.json';
  document.body.appendChild(a); a.click(); a.remove();
  URL.revokeObjectURL(url);
  showToast('JSON esportato');
}

/* ======================= RENDER LISTA ======================= */
function renderStats(){
  const today = todayIso();
  const tot = TRIPS.length;
  const conf = TRIPS.filter(t=> tripStatus(t)==='confermato').length;
  const upcoming = TRIPS.filter(t=>t.dataIso && t.dataIso>=today).slice().sort((a,b)=> a.dataIso.localeCompare(b.dataIso));
  const next = upcoming[0];
  document.getElementById('statsRow').innerHTML = `
    <div class="stat-chip"><div class="n">${tot}</div><div class="l">Viaggi totali</div></div>
    <div class="stat-chip"><div class="n">${conf}</div><div class="l">Confermati</div></div>
    <div class="stat-chip"><div class="n">${next ? next.data.slice(0,5) : '—'}</div><div class="l">Prossima partenza</div></div>
  `;
  document.getElementById('subCount').textContent = `${tot} viaggi in programma · ${conf} confermati`;
}

function legMiniRowHtml(leg){

  return `
  <div class="ticket-leg-row">
    <span class="ticket-leg-time">${when||'—'}</span>
    <span class="ticket-leg-route">${leg.partenza||'—'} → ${leg.arrivo||'—'}</span>
  </div>`;
}

function escHtml(x){ return String(x).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function ticketHtml(t){
  const nHotels = t.hotels.length;
  const status = tripStatus(t);
  const showTotal = (status==='confermato' || status==='effettuato') && t.totale!=null;
  const annoViaggio = annoDaIso(t.dataIso);
  const daPagare = status!=='effettuato' ? subtotaleDaPagare(t) : 0;
  return `
  <div class="ticket" data-id="${t.id}">
    <div class="ticket-main">
      <div class="route">
        <div class="city">${t.partenza||'—'}<span>Partenza</span></div>
        <div class="plane-track"></div>
        <div class="city" style="text-align:right">${t.arrivo||'—'}<span>Arrivo</span></div>
      </div>
    </div>
    ${t.legs.length? `<div class="ticket-legs">${t.legs.map(legMiniRowHtml).join('')}</div>` : ''}
    ${showTotal? `
    <div class="ticket-total">
      <span class="label">Totale viaggio</span>
      <span class="amt">${eur(t.totale)}${attualizzatoHtml(t.totale, annoViaggio)}</span>
    </div>` : ''}
    <div class="perf"></div>
    <div class="ticket-foot">
      <div class="badges">
        ${nHotels? `<span class="mini-badge">${nHotels} hotel</span>`:''}
        ${daPagare>0? `<span class="mini-badge da-pagare-badge">Da pagare: ${eur(daPagare)}</span>`:''}
        ${(t.partecipanti||[]).map(p=>`<span class="mini-badge part-badge">👥 ${escHtml(p)}</span>`).join('')}
        ${(t.luoghi||[]).map(l=>`<span class="mini-badge luogo-badge">📍 ${escHtml(l)}</span>`).join('')}
      </div>
      ${statusBadgeHtml(status)}
    </div>

}

function allDestinations(){
  const set = new Set();
  TRIPS.forEach(t=> t.legs.forEach(l=>{
    if(l.arrivo) set.add(l.arrivo);
    if(l.partenza) set.add(l.partenza);
  }));
  return [...set].sort((a,b)=> a.localeCompare(b, 'it'));
}
function populateDestList(){
  const dl = document.getElementById('destList');
  dl.innerHTML = allDestinations().map(d=> `<option value="${d}"></option>`).join('');
}
function matchesDestination(t, q){
  if(!q) return true;
  const qq = q.trim().toLowerCase();
  if(!qq) return true;
  return t.legs.some(l=> (l.arrivo||'').toLowerCase().includes(qq) || (l.partenza||'').toLowerCase().includes(qq));
}

function hotelCostoTotale(t){
  const vals = (t.hotels||[]).map(h=>h.prezzo).filter(v=>v!=null);
  return vals.length ? Math.round(vals.reduce((s,v)=>s+v,0)*100)/100 : null;
}
function voliCostoTotale(t){
  const vals = (t.legs||[]).map(l=>l.prezzo).filter(v=>v!=null);
  return vals.length ? Math.round(vals.reduce((s,v)=>s+v,0)*100)/100 : null;
}
function sortTrips(items, sortKey){
  const sorted = items.slice();
  if(sortKey==='data'){
    sorted.sort((a,b)=> (a.dataIso||'9999').localeCompare(b.dataIso||'9999'));
  } else {
    const getVal = sortKey==='totale' ? (t=>t.totale) : sortKey==='hotel' ? hotelCostoTotale : voliCostoTotale;
    sorted.sort((a,b)=>{
      const va = getVal(a), vb = getVal(b);
      if(va==null && vb==null) return 0;
      if(va==null) return 1;  // i viaggi senza quel dato vanno in fondo
      if(vb==null) return -1;
      return vb - va; // dal più caro al più economico
    });
  }
  return sorted;
}

function renderList(){
  const list = document.getElementById('list');
  const today = todayIso();
  let items = TRIPS.slice();

  if(currentFilter==='prossimi') items = items.filter(t=> !t.dataIso || t.dataIso>=today);
  else if(currentFilter==='confermati') items = items.filter(t=> tripStatus(t)==='confermato');
  else if(currentFilter==='attesa') items = items.filter(t=> tripStatus(t)==='attesa');
  else if(currentFilter==='effettuati') items = items.filter(t=> tripStatus(t)==='effettuato');
  // 'tutti' non applica alcun filtro di stato/data

  const destQuery = document.getElementById('destFilter').value;
  items = items.filter(t=> matchesDestination(t, destQuery));

  if(selectedPartecipanti.size){
    items = items.filter(t=> (t.partecipanti||[]).some(p=> selectedPartecipanti.has(p)));
  }

  items = sortTrips(items, currentSort);

  if(!items.length){
    list.innerHTML = `<div class="empty-state">Nessun viaggio in questa categoria.</div>`;
  } else {
    list.innerHTML = items.map(ticketHtml).join('');
    list.querySelectorAll('.ticket').forEach(el=>{
      el.addEventListener('click', ()=> openDetail(Number(el.dataset.id)));
    });
  }
  populateDestList();
  renderStats();
}

/* ======================= PREPAGATO / DA PAGARE ======================= */
function itemDaPagareAmount(item, costo){
  if(!item || item.prepagato) return 0;
  const c = costo ?? 0;
  return Math.min(Math.max(item.daPagare ?? 0, 0), c);
}
function itemPrepagatoAmount(item, costo){
  const c = costo ?? 0;
  if(!item || item.prepagato) return c;
  return Math.max(0, c - itemDaPagareAmount(item, costo));
}
function subtotaleDaPagare(t){
  let s = 0;
  (t.legs||[]).forEach(l=> s += itemDaPagareAmount(l, l.prezzo));
  (t.parcheggi||[]).forEach(p=> s += itemDaPagareAmount(p, p.prezzo));
  (t.trasporti||[]).forEach(tr=> s += itemDaPagareAmount(tr, tr.costo));
  (t.hotels||[]).forEach(h=> s += itemDaPagareAmount(h, h.prezzo));
  return Math.round(s*100)/100;
}
function subtotalePrepagato(t){
  let s = 0;
  (t.legs||[]).forEach(l=> s += itemPrepagatoAmount(l, l.prezzo));
  (t.parcheggi||[]).forEach(p=> s += itemPrepagatoAmount(p, p.prezzo));
  (t.trasporti||[]).forEach(tr=> s += itemPrepagatoAmount(tr, tr.costo));
  (t.hotels||[]).forEach(h=> s += itemPrepagatoAmount(h, h.prezzo));
  return Math.round(s*100)/100;
}

// (prezzi biglietti sommati * 2) + (parcheggio/persone)*2 + (trasporto/persone)*2
// + costo hotel per gli hotel senza note o con nota "Alternativa 1"
function computeAutoTotale(t){
  const persone = (t.persone && t.persone > 0) ? t.persone : 1;
  const sumBiglietti = (t.legs||[]).reduce((s,l)=> s + (l.prezzo!=null ? l.prezzo : 0), 0);
  const sumParcheggio = (t.parcheggi||[]).reduce((s,p)=> s + (p.prezzo!=null ? p.prezzo : 0), 0);
  const sumTrasporto = (t.trasporti||[]).reduce((s,tr)=> s + (tr.costo!=null ? tr.costo : 0), 0);
  const sumHotel = (t.hotels||[]).reduce((s,h)=>{
    const note = (h.note||'').trim().toLowerCase();
    const include = note==='' || note==='alternativa 1';
    return s + (include && h.prezzo!=null ? h.prezzo : 0);
  }, 0);
  const totale = (sumBiglietti*2) + (sumParcheggio/persone)*2 + (sumTrasporto/persone)*2 + sumHotel;
  return Math.round(totale*100)/100;
}

  });
  document.getElementById('saveEditBtn').addEventListener('click', saveEdit);
  document.getElementById('cancelEditBtn').addEventListener('click', ()=>{
    const existed = TRIPS.some(t=>t.id===editingTrip.id);
    if(existed) openDetail(editingTrip.id); else closeDetail();
  });
}

function saveEdit(){
  const t = editingTrip;
  if(!t.legs.length && !t.hotels.length){
    showToast('Aggiungi almeno una tratta o un hotel');
    return;
  }
  const first = t.legs[0];
  if(first){
    t.data = first.data; t.dataIso = first.dataIso; t.orario = first.orario;
    t.partenza = first.partenza; t.arrivo = first.arrivo;
  }
  // il totale viene ora inserito manualmente in un unico campo (editingTrip.totale,
  // già aggiornato dall'input); lo riportiamo sulla prima tratta per mantenere
  // coerente l'esportazione verso Excel, azzerando eventuali totali residui sulle altre.
  t.legs.forEach((l,i)=>{ l.totale = (i===0) ? t.totale : null; });

  const idx = TRIPS.findIndex(x=>x.id===t.id);
  if(idx>=0) TRIPS[idx] = t; else TRIPS.push(t);
  persist();
  renderList();
  showToast('Viaggio salvato');
  openDetail(t.id);
}

  return [...set].sort((a,b)=> a.localeCompare(b,'it'));

function renderSummaryResult(){
  const statiSel = new Set([...document.querySelectorAll('.summary-stato:checked')].map(c=>c.value));
  const destSel = new Set([...document.querySelectorAll('.dest-checklist input:checked')].map(c=>c.value));
  const counts = {};
  let totale = 0;
  TRIPS.forEach(t=>{
    const st = tripStatus(t);
    if(!statiSel.has(st)) return;
    const dest = t.arrivo || '—';
    if(!destSel.has(dest)) return;
    counts[dest] = (counts[dest]||0) + 1;
    totale++;
  });
  const rows = Object.entries(counts).sort((a,b)=> b[1]-a[1]);
  const box = document.getElementById('summaryResult');
  if(!rows.length){
    box.innerHTML = `<p style="color:var(--slate-2); font-size:13px;">Nessun viaggio corrisponde ai filtri selezionati.</p>`;
    return;
  }
  box.innerHTML = `
    <div class="pivot-total">${totale} viaggio${totale===1?'':'i'} in totale</div>
    ${rows.map(([dest,n])=> `<div class="pivot-row"><span class="pivot-dest">${dest}</span><span class="pivot-count">${n}</span></div>`).join('')}
  `;
}

/* ======================= ATLANTE DEI LUOGHI VISITATI ======================= */
const ATLAS_W = 960, ATLAS_H = 480;
function atlasProject(lon, lat){
  const x = (lon + 180) / 360 * ATLAS_W;
  const y = (90 - lat) / 180 * ATLAS_H;
  return [x, y];
}
// Unisce i conteggi storici (ATLAS_PLACES_LEGACY, dal vecchio foglio) con i
// luoghi inseriti viaggio per viaggio nel campo "Luoghi visitati": ogni volta
// che un viaggio cita un luogo già noto (stessa chiave, minuscolo/spazi tolti)
// aggiunge +1 al suo conteggio. I luoghi mai visti prima restano "non
// riconosciuti" (nessuna coordinata) finché non vengono aggiunti alla mappa.
function atlasCombinedPlaces(){
  const combined = {};
  Object.entries(ATLAS_PLACES_LEGACY).forEach(([name, p])=>{
    combined[name] = { ...p };
  });
  const unresolved = {};
  TRIPS.forEach(t=>{
    (t.luoghi||[]).forEach(raw=>{
      const key = raw.trim().toLowerCase();
      if(!key) return;
      if(combined[key]){
        combined[key].count += 1;
      } else {
        unresolved[key] = (unresolved[key]||0) + 1;
      }
    });
  });
  return { places: combined, unresolved };
}
function atlasCountryTotals(places){
  const tot = {};
  Object.values(places).forEach(p=>{
    tot[p.country] = (tot[p.country]||0) + p.count;
  });
  return tot;
}
function atlasColorForCount(count, maxCount){
  if(!count) return null;
  const t = Math.sqrt(count) / Math.sqrt(maxCount || 1);
  // interpola da un oro tenue a un oro acceso
  const l = 62 - t*30; // luminosità: più visite = più scuro/acceso
  return `hsl(42, 70%, ${Math.max(28,l)}%)`;
}

function renderAtlasWorld(){
  document.getElementById('atlasEyebrow').textContent = 'Atlante';
  document.getElementById('atlasTitle').textContent = 'Luoghi visitati';
  const { places: allPlaces, unresolved } = atlasCombinedPlaces();
  const totals = atlasCountryTotals(allPlaces);
  const maxCount = Math.max(...Object.values(totals), 1);

  const paths = Object.keys(ATLAS_WORLD_PATHS).map(name=>{
    const d = ATLAS_WORLD_PATHS[name];
    if(!d) return '';
    const count = totals[name];
    const cls = count ? 'atlas-country' : 'atlas-country unvisited';
    const fill = count ? atlasColorForCount(count, maxCount) : '';
    return `<path class="${cls}" data-country="${name.replace(/"/g,'&quot;')}" d="${d}" ${fill?`style="fill:${fill}"`:''}><title>${name}${count?` — ${count} volte`:''}</title></path>`;
  }).join('');

  const fallbackCountries = Object.keys(totals).filter(c=> !ATLAS_WORLD_PATHS[c]);
  const fallbackHtml = fallbackCountries.length ? `
    <div class="atlas-fallback-list">
      <p class="section-title" style="margin:0 0 4px;">Non rappresentati sulla mappa (paesi troppo piccoli)</p>
      ${fallbackCountries.map(c=> `<div class="atlas-region-row"><span class="name">${c}</span><span class="n">${totals[c]}×</span></div>`).join('')}
    </div>` : '';

  const unresolvedNames = Object.keys(unresolved);
  const unresolvedHtml = unresolvedNames.length ? `
    <p class="atlas-note" style="color:var(--danger);">
      ${unresolvedNames.length} luogo/hi scritto/i nei viaggi ma non ancora sulla mappa: <b>${unresolvedNames.join(', ')}</b>.
      Scrivimeli in chat per aggiungerli.
    </p>` : '';

  document.getElementById('atlasBody').innerHTML = `
    <div class="atlas-legend">
      <span class="swatch" style="background:#1C2A3D;"></span> mai
      <span class="swatch" style="background:hsl(42,70%,58%);"></span> poche volte
      <span class="swatch" style="background:hsl(42,70%,32%);"></span> molte volte
    </div>
    <div class="atlas-map-wrap">
      <svg viewBox="0 0 ${ATLAS_W} ${ATLAS_H}">${paths}</svg>
    </div>
    <p class="atlas-note">Tocca una nazione colorata per vedere i luoghi visitati nel dettaglio.</p>
    ${unresolvedHtml}
    ${fallbackHtml}
  `;
  document.querySelectorAll('.atlas-country:not(.unvisited)').forEach(el=>{
    el.addEventListener('click', ()=> renderAtlasCountry(el.dataset.country, allPlaces));
  });
  document.querySelectorAll('.atlas-fallback-list .atlas-region-row').forEach((el,i)=>{
    el.style.cursor = 'pointer';
    el.addEventListener('click', ()=> renderAtlasCountry(fallbackCountries[i], allPlaces));
  });
}

function renderAtlasCountry(countryName, allPlaces){
  if(!allPlaces) allPlaces = atlasCombinedPlaces().places;
  const places = Object.entries(allPlaces).filter(([,p])=> p.country===countryName);
  const maxCount = Math.max(...places.map(([,p])=>p.count), 1);
  const bbox = ATLAS_COUNTRY_BBOX[countryName];

  document.getElementById('atlasEyebrow').textContent = 'Atlante';
  document.getElementById('atlasTitle').textContent = countryName;

  // Raggruppo i segnaposto in cluster geografici vicini (alcuni territori come
  // Canarie/Baleari sono lontanissimi dalla terraferma e non starebbero mai
  // in un'unica inquadratura sensata): ogni cluster avrà la propria mini-mappa.
  const pts = places.map(([name,p])=>({name, p, xy: atlasProject(p.lon, p.lat)}));
  const clusters = [];
  const CLUSTER_DIST = 18; // unità di viewBox (~6.75° di longitudine)
  pts.forEach(pt=>{
    let found = clusters.find(c => c.some(o => Math.hypot(o.xy[0]-pt.xy[0], o.xy[1]-pt.xy[1]) < CLUSTER_DIST));
    if(found) found.push(pt); else clusters.push([pt]);
  });
  // unisco cluster che nel frattempo si sono avvicinati (merge semplice iterativo)
  let merged = true;
  while(merged){
    merged = false;
    outer:
    for(let i=0;i<clusters.length;i++){
      for(let j=i+1;j<clusters.length;j++){
        if(clusters[i].some(a=> clusters[j].some(b=> Math.hypot(a.xy[0]-b.xy[0], a.xy[1]-b.xy[1]) < CLUSTER_DIST))){
          clusters[i] = clusters[i].concat(clusters[j]);
          clusters.splice(j,1);
          merged = true;
          break outer;
        }
      }
    }
  }
  clusters.sort((a,b)=> b.length - a.length);

  const countryPath = ATLAS_WORLD_PATHS[countryName];
  function clusterMapHtml(cluster, label){
    const xs = cluster.map(c=>c.xy[0]), ys = cluster.map(c=>c.xy[1]);
    let x0=Math.min(...xs), x1=Math.max(...xs), y0=Math.min(...ys), y1=Math.max(...ys);
    const padX = Math.max((x1-x0)*0.25, 8), padY = Math.max((y1-y0)*0.25, 8);
    x0-=padX; x1+=padX; y0-=padY; y1+=padY;
    const vb = `${x0.toFixed(1)} ${y0.toFixed(1)} ${(x1-x0).toFixed(1)} ${(y1-y0).toFixed(1)}`;
    // Raggio proporzionale al riquadro visibile (non a un valore fisso), così i
    // segnaposto restano piccoli sia su un'area molto zoomata sia su una ampia.
    const refSize = Math.min(x1-x0, y1-y0);
    const pins = cluster.map(({name,p,xy})=>{
      const t = Math.sqrt(p.count) / Math.sqrt(maxCount || 1);
      const r = refSize * (0.012 + t*0.018);
      return `<g class="atlas-pin"><title>${name} — ${p.count} volte</title><circle cx="${xy[0].toFixed(2)}" cy="${xy[1].toFixed(2)}" r="${r.toFixed(2)}" fill="${atlasColorForCount(p.count,maxCount)}"/></g>`;
    }).join('');
    // mostro il poligono del paese solo se si sovrappone davvero a quest'area
    const showCountry = countryPath && bbox && !(x1 < bbox[0] || x0 > bbox[2] || y1 < bbox[1] || y0 > bbox[3]);
    return `<div class="atlas-map-wrap">
      ${label? `<p class="section-title" style="margin:10px 16px 6px;">${label}</p>`:''}
      <svg viewBox="${vb}">${showCountry? `<path class="atlas-country" d="${countryPath}" style="fill:#2A3D57"/>`:''}${pins}</svg>
    </div>`;
  }
  const mapsHtml = clusters.map((c,i)=> clusterMapHtml(c, clusters.length>1? `Zona ${i+1} (${c.length} luoghi)` : null)).join('');

  const regionTotals = {};
  if(countryName === 'Italy'){
    places.forEach(([,p])=>{ regionTotals[p.region] = (regionTotals[p.region]||0) + p.count; });
  }
  const regionsHtml = Object.keys(regionTotals).length ? `
    <p class="section-title" style="margin:14px 20px 8px;">Per regione</p>
    <div class="atlas-regions-list">
      ${Object.entries(regionTotals).sort((a,b)=>b[1]-a[1]).map(([r,n])=> `<div class="atlas-region-row"><span class="name">${r}</span><span class="n">${n}×</span></div>`).join('')}
    </div>` : '';

  const placesHtml = `
    <p class="section-title" style="margin:14px 20px 8px;">Luoghi (${places.length})</p>
    <div class="atlas-regions-list">
      ${places.sort((a,b)=>b[1].count-a[1].count).map(([name,p])=> `<div class="atlas-region-row"><span class="name">${name.replace(/\b\w/g,c=>c.toUpperCase())}${p.region?` <span style="color:var(--slate-2)">(${p.region})</span>`:''}</span><span class="n">${p.count}×</span></div>`).join('')}
    </div>`;

  document.getElementById('atlasBody').innerHTML = `
    <button class="atlas-back-btn" id="atlasBackBtn">← Mondo</button>
    ${mapsHtml}
    ${regionsHtml}
    ${placesHtml}
  `;
  document.getElementById('atlasBackBtn').addEventListener('click', renderAtlasWorld);
}

  document.getElementById('atlasSheet').classList.add('open');

document.getElementById('fileInputExcel').addEventListener('change', e=>{
  const file = e.target.files[0];
  if(!file) return;
  if(!confirm('Importare da Excel sostituirà tutti i viaggi attualmente nell\'app. Continuare?')){ e.target.value=''; return; }
  const reader = new FileReader();
  reader.onload = ev=>{
    try{
      const data = new Uint8Array(ev.target.result);
      const wb = XLSX.read(data, {type:'array', cellDates:true});
      const trips = parseWorkbookToTrips(wb);
      if(!trips || !trips.length){ showToast('Nessun viaggio trovato nel file'); return; }
      TRIPS = trips;
      persist(); renderList();
      showToast(`${trips.length} viaggi importati da Excel`);
    }catch(err){ console.error(err); showToast('Errore nella lettura del file Excel'); }
  };
  reader.readAsArrayBuffer(file);
  e.target.value = '';
});

});
